[project]
name = "study-buddy"
version = "1.0.0"
description = "STUDY-BUDDY — AI Career & Research Assistant (Flask)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# NOTE (audit fix, 2026-10-28): requirements.in + hash-pinned
# requirements.txt are the authoritative install source (Render,
# Dockerfile, and CI all install from requirements.txt). This list
# mirrors requirements.in exactly — pinned where .in pins, loose where
# .in is loose — so `pip install .` does not silently diverge. If you
# change a dependency, change requirements.in first, regenerate
# requirements.txt with hashes, then mirror the change here.
dependencies = [
    "flask==3.1.3",
    "python-dotenv==1.2.4",
    "google-genai==2.31.0",
    "pypdf==6.21.2",
    "python-docx==1.2.0",
    "gunicorn==26.2.0",
    "werkzeug==3.1.9",
    "Authlib==1.9.1",
    "requests",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "flask-wtf",
    "flask-limiter",
    "flask-sqlalchemy",
    "flask-login",
    "psycopg2-binary",
    "flask-migrate",
    "defusedxml",
    "pypdfium2",
    "pdfplumber",
    "psycopg[binary]",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "bandit",
    "pip-audit",
    "pre-commit",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# TEST-01 baseline: gate on real bugs (pyflakes F, bugbear B, pycodestyle
# errors E4/E7/E9). Style modernizations (UP031 % -> f-string, E402 lazy
# imports, etc.) ratchet in ARC-07 — 400+ legacy sites, not day-one.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008",  # function call in default arg (used deliberately in a few places)
    "B904",  # raise-without-from: 14 legacy sites, ARC-07
    "E402",  # lazy imports inside functions avoid circular imports here
    "E741",  # ambiguous names (l, I) in legacy code, ARC-07
]
exclude = [
    ".venv", "venv", "__pycache__", "archive", "docs",
    "migrations", "*.pyc",
]

[tool.ruff.lint.isort]
known-first-party = ["studybuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# NOTE: OPP_NO_AUTO_REFRESH=1 is set in tests/conftest.py (no plugin needed).

[tool.coverage.run]
source = ["unified_app", "studybuddy"]
omit = ["*/tests/*", "*/test_*"]

[tool.bandit]
exclude_dirs = ["tests", "archive", "docs"]
skips = ["B101"]  # assert usage is fine in this codebase's tests

[tool.mutmut]
# TEST-10: mutation testing for parsing/taxonomy logic.
# Target mutation score > 70% on these modules (roadmap TEST-10).
source_paths = ["studybuddy/parsing.py", "studybuddy/skills_taxonomy.py"]
# Fast, deterministic suites that exercise the mutated modules.
pytest_add_cli_args_test_selection = [
  "tests/test_ws5_property.py",
  "tests/test_skills_taxonomy.py",
  "tests/test_phase1_parsing.py",
]
