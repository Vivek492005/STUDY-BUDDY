# TEST-13: Study-Buddy internal JSON API — contract spec v1.
#
# HAND-WRITTEN and honest: there is no PROD-09 public API / OpenAPI
# generator in the codebase, so this spec was written by reading the
# route handlers in unified_app.py and studybuddy/ultimate_routes.py
# (2026-10-19). Every path here is cross-checked by
# tests/test_ws5_contracts.py:
#   * the path+method exists in app.url_map (see x-flask-path),
#   * auth endpoints return 401 + {"error": str} when unauthenticated,
#   * safe public GETs return the documented top-level keys
#     (see x-response-keys),
#   * error bodies match the {"error": "<user_message>"} shape from
#     studybuddy/exceptions.py.
#
# Auth: session cookie (Flask-Login). LLM/network-backed endpoints are
# documented for their auth + error contracts only — their success
# bodies depend on external services and are NOT asserted in tests.
# Follow-up: schemathesis fuzzing against this spec (roadmap TEST-13).
#
# SCOPE (audit fix, 2026-10-28): this spec is the PUBLIC API contract.
# It documents EVERY public /api/* path in tests/route_policy.yaml
# (verified by tests/test_ws5_contracts.py::test_spec_covers_route_policy),
# plus a selective set of authenticated endpoints. Auth endpoints NOT in
# this spec are still classified in tests/route_policy.yaml and covered
# by tests/test_route_policy.py — they are undocumented here, not
# undocumented everywhere. The previous contract test demanded equality
# between spec paths and ALL policy /api/* paths (24 vs 97), which had
# been failing since the policy grew; the rescoped test asserts public
# coverage exactly, forbids phantom paths, and floors the auth-op count
# so auth documentation cannot silently shrink. The 9 public paths added
# 2026-10-28 had their x-response-keys probed from live handler output,
# not written from memory (see tests/test_ws5_contracts.py EXAMPLE_URLS).
openapi: 3.0.3
info:
  title: Study-Buddy Internal JSON API
  version: "1.0.0-contract-v1"
  description: >
    Hand-written contract for the /api/* JSON endpoints (contract-testing
    v1). Scope: every PUBLIC /api/* path in tests/route_policy.yaml, plus
    a selective set of authenticated endpoints. Auth levels mirror
    tests/route_policy.yaml. Success bodies of LLM/network-backed
    endpoints are documented from code, not asserted.
servers:
  - url: http://127.0.0.1:5000
    description: local dev
security:
  - sessionCookie: []
tags:
  - name: practice
  - name: resume
  - name: citation
  - name: research
  - name: lab
  - name: career
  - name: mentors
  - name: salary
paths:
  # ---------------------------------------------------------------- practice
  /api/companies:
    get:
      tags: [practice]
      summary: Companies with interview/coding questions
      x-flask-path: /api/companies
      x-auth: public
      x-response-keys: [interview, coding]
      responses:
        '200':
          description: Company lists
          content:
            application/json:
              schema:
                type: object
                required: [interview, coding]
                properties:
                  interview: {type: array, items: {type: string}}
                  coding: {type: array, items: {type: string}}
  /api/topics:
    get:
      tags: [practice]
      summary: Coding-practice topics
      x-flask-path: /api/topics
      x-auth: public
      x-response-keys: []
      responses:
        '200':
          description: Topic list (JSON array)
          content:
            application/json:
              schema: {type: array, items: {type: string}}
  /api/coding-practice:
    get:
      tags: [practice]
      summary: Coding questions, optional company filter
      x-flask-path: /api/coding-practice
      x-auth: public
      x-response-keys: []
      parameters:
        - {name: topic, in: query, schema: {type: string}}
        - {name: difficulty, in: query, schema: {type: string}}
      responses:
        '200':
          description: Question list (JSON array)
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /api/coding-practice/{company}:
    get:
      tags: [practice]
      summary: Coding questions for one company
      x-flask-path: /api/coding-practice/<company>
      x-auth: public
      x-response-keys: []
      parameters:
        - {name: company, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Question list (JSON array)
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /api/interview-questions/{company}:
    get:
      tags: [practice]
      summary: Interview questions for one company
      x-flask-path: /api/interview-questions/<company>
      x-auth: public
      x-response-keys: []
      parameters:
        - {name: company, in: path, required: true, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: difficulty, in: query, schema: {type: string}}
      responses:
        '200':
          description: Question list (JSON array)
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /api/dsa/problems:
    get:
      tags: [practice]
      summary: DSA problem list with filters
      x-flask-path: /api/dsa/problems
      x-auth: public
      x-response-keys: [problems, count]
      parameters:
        - {name: topic, in: query, schema: {type: string}}
        - {name: difficulty, in: query, schema: {type: string}}
      responses:
        '200':
          description: Problems + count (my_status added when logged in)
          content:
            application/json:
              schema:
                type: object
                required: [problems, count]
                properties:
                  problems: {type: array, items: {type: object}}
                  count: {type: integer}
  /api/eng/jd-v2/match:
    post:
      tags: [eng]
      summary: JD matcher v2 — match resume against a job description
      x-flask-path: /api/eng/jd-v2/match
      x-auth: public
      x-response-keys: [score]
      responses:
        '200':
          description: Match result with score, strengths, gaps, suggestions
          content:
            application/json:
              schema: {type: object}
        '400':
          description: JD text too short (<50 chars)
  /api/eng/jobs/recommend:
    post:
      tags: [eng]
      summary: Recommend real job cards matched to resume skills
      x-flask-path: /api/eng/jobs/recommend
      x-auth: public
      x-response-keys: []
      responses:
        '200':
          description: Ranked job recommendations
          content:
            application/json:
              schema: {type: object}
  /api/eng/jobs/paste-jd:
    post:
      tags: [eng]
      summary: Paste a JD to create a trackable job card
      x-flask-path: /api/eng/jobs/paste-jd
      x-auth: public
      x-response-keys: [title]
      responses:
        '200':
          description: Created job card
          content:
            application/json:
              schema: {type: object}
  /api/eng/interview/score-v2:
    post:
      tags: [eng]
      summary: Interview answer scoring v2 with rubric
      x-flask-path: /api/eng/interview/score-v2
      x-auth: public
      x-response-keys: [score, rubric, improvements]
      responses:
        '200':
          description: Score with rubric and improvements (never render score alone)
          content:
            application/json:
              schema: {type: object}
  /api/star/examples:
    get:
      tags: [practice]
      summary: Annotated STAR examples
      x-flask-path: /api/star/examples
      x-auth: public
      x-response-keys: [examples, count]
      parameters:
        - {name: competency, in: query, schema: {type: string}}
      responses:
        '200':
          description: Examples + count
          content:
            application/json:
              schema:
                type: object
                required: [examples, count]
                properties:
                  examples: {type: array, items: {type: object}}
                  count: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
  # ------------------------------------------------------------------ resume
  /api/parse_preview:
    post:
      tags: [resume]
      summary: Parse an uploaded resume, return extracted text + fields
      x-flask-path: /api/parse_preview
      x-auth: public
      x-auth-note: observed public (no auth check in handler); route_policy.yaml says auth
      x-response-keys: [text, text_truncated, fields, layout, quality, warnings]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Extracted text and detected fields
          content:
            application/json:
              schema:
                type: object
                required: [text, text_truncated, fields, layout, quality, warnings]
                properties:
                  text: {type: string}
                  text_truncated: {type: boolean}
                  fields: {type: object}
                  layout: {type: object}
                  quality: {type: object}
                  warnings: {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  # ---------------------------------------------------------------- citation
  /api/cite/format:
    post:
      tags: [citation]
      summary: Format one citation in a style
      x-flask-path: /api/cite/format
      x-auth: public
      x-auth-note: observed public (no auth check in handler); route_policy.yaml says auth
      x-response-keys: [citation, style]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meta, style]
              properties:
                meta: {type: object}
                style: {type: string, enum: [apa, mla, chicago, ieee, vancouver]}
      responses:
        '200':
          description: Formatted citation
          content:
            application/json:
              schema:
                type: object
                required: [citation, style]
                properties:
                  citation: {type: string}
                  style: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/cite/bibtex/export:
    post:
      tags: [citation]
      summary: Export metadata as BibTeX
      x-flask-path: /api/cite/bibtex/export
      x-auth: public
      x-auth-note: observed public (no auth check in handler); route_policy.yaml says auth
      x-response-keys: [bibtex]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meta]
              properties:
                meta: {type: object}
      responses:
        '200':
          description: BibTeX entry
          content:
            application/json:
              schema:
                type: object
                required: [bibtex]
                properties:
                  bibtex: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/cite/bibtex/import:
    post:
      tags: [citation]
      summary: Parse pasted BibTeX into metadata
      x-flask-path: /api/cite/bibtex/import
      x-auth: public
      x-auth-note: observed public (no auth check in handler); route_policy.yaml says auth
      x-response-keys: [metas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string}
      responses:
        '200':
          description: Parsed metadata entries
          content:
            application/json:
              schema:
                type: object
                required: [metas]
                properties:
                  metas: {type: array, items: {type: object}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/cite/guide/{style}:
    get:
      tags: [citation]
      summary: In-app style-guide reference for one citation style
      x-flask-path: /api/cite/guide/<style>
      x-auth: public
      x-auth-note: observed public (no auth check in handler); route_policy.yaml says auth
      x-response-keys: [in_text]
      parameters:
        - {name: style, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Style guide (object; shape from studybuddy.citation_fmt)
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
  # ----------------------------------------------------------------- research
  /api/chat_research:
    post:
      tags: [research]
      summary: Document-intelligence chat (LLM-backed, quota-checked)
      x-flask-path: /api/chat_research
      x-auth: auth
      x-response-keys: [response]
      x-success-shape: from-code-only
      x-response-keys: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string}
                document_text: {type: string}
                history: {type: array, items: {type: object}}
      responses:
        '200':
          description: Model reply (shape documented from code; not asserted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: {type: string}
                  research_session_id: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/study/import/arxiv:
    post:
      tags: [research]
      summary: Import a paper by arXiv ID (network-backed)
      x-flask-path: /api/study/import/arxiv
      x-auth: auth
      x-success-shape: from-code-only
      x-response-keys: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arxiv_id]
              properties:
                arxiv_id: {type: string, example: "1706.03762"}
      responses:
        '200':
          description: Normalized paper metadata (network-backed; not asserted)
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/study/import/doi:
    post:
      tags: [research]
      summary: Import a paper by DOI (network-backed)
      x-flask-path: /api/study/import/doi
      x-auth: auth
      x-success-shape: from-code-only
      x-response-keys: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doi]
              properties:
                doi: {type: string, example: "10.1038/nature12373"}
      responses:
        '200':
          description: Normalized paper metadata (network-backed; not asserted)
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/study/import/{openalex_id}/graph:
    get:
      tags: [research]
      summary: Citation graph around an imported paper (network-backed)
      x-flask-path: /api/study/import/<path:openalex_id>/graph
      x-auth: auth
      x-success-shape: from-code-only
      x-response-keys: []
      parameters:
        - {name: openalex_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Citation graph (network-backed; not asserted)
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/study/import/pdf:
    post:
      tags: [research]
      summary: Fetch an imported paper's PDF into the study library
      x-flask-path: /api/study/import/pdf
      x-auth: auth
      x-success-shape: from-code-only
      x-response-keys: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pdf_url]
              properties:
                pdf_url: {type: string}
                title: {type: string}
                arxiv_id: {type: string}
                doi: {type: string}
      responses:
        '200':
          description: Import result (network-backed; not asserted)
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/constructor_generate:
    post:
      tags: [research]
      summary: Generate a paper draft section (LLM-backed)
      x-flask-path: /api/constructor_generate
      x-auth: auth
      x-success-shape: from-code-only
      x-response-keys: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Generated draft (LLM-backed; not asserted)
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/BadGateway'}
  # ---------------------------------------------------------------------- lab
  /api/ultimate/tools:
    get:
      tags: [lab]
      summary: List Ultimate Lab tools
      x-flask-path: /api/ultimate/tools
      x-auth: auth
      x-response-keys: [ok, count, tools]
      responses:
        '200':
          description: Tool catalogue
          content:
            application/json:
              schema:
                type: object
                required: [ok, count, tools]
                properties:
                  ok: {type: boolean}
                  count: {type: integer}
                  tools: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/ultimate/run/{tool_id}:
    post:
      tags: [lab]
      summary: Run one Ultimate Lab tool
      x-flask-path: /api/ultimate/run/<path:tool_id>
      x-auth: auth
      x-response-keys: [ok]
      parameters:
        - {name: tool_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Tool result envelope
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
  # ------------------------------------------------- public surface, added
  # 2026-10-28 (audit fix): the remaining public /api/* paths from
  # tests/route_policy.yaml. x-response-keys probed from live handlers.
  /api/career/freshness:
    get:
      tags: [career]
      summary: Data freshness per dataset (career data)
      x-flask-path: /api/career/freshness
      x-auth: public
      x-response-keys: [datasets, success]
      responses:
        '200':
          description: Freshness report
          content:
            application/json:
              schema:
                type: object
                required: [datasets, success]
                properties:
                  datasets: {type: object}
                  success: {type: boolean}
  /api/dsa/progress:
    get:
      tags: [practice]
      summary: DSA progress summary (zeroed for anonymous visitors)
      x-flask-path: /api/dsa/progress
      x-auth: public
      x-response-keys: [a2z, classic, is_authed]
      responses:
        '200':
          description: Progress summary
          content:
            application/json:
              schema:
                type: object
                required: [a2z, classic, is_authed]
                properties:
                  a2z: {type: object}
                  classic: {type: object}
                  is_authed: {type: boolean}
  /api/interview/intel/{company}:
    get:
      tags: [practice]
      summary: Interview intel for one company
      x-flask-path: /api/interview/intel/<company>
      x-auth: public
      x-response-keys: [categories, company, focus_tip, note, sample_questions, top_roles, total_questions]
      parameters:
        - {name: company, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Company interview intel
          content:
            application/json:
              schema:
                type: object
                required: [company]
                properties:
                  company: {type: string}
                  categories: {type: array, items: {type: string}}
                  sample_questions: {type: array, items: {type: object}}
                  total_questions: {type: integer}
  /api/mentors/qa:
    get:
      tags: [mentors]
      summary: Public mentor Q&A list
      x-flask-path: /api/mentors/qa
      x-auth: public
      x-response-keys: [qa, success]
      responses:
        '200':
          description: Q&A list
          content:
            application/json:
              schema:
                type: object
                required: [qa, success]
                properties:
                  qa: {type: array, items: {type: object}}
                  success: {type: boolean}
  # NOTE: only the GET is documented here. The same path also accepts a
  # POST, but it is session-authenticated (@login_required) and requires
  # a prior booking with the mentor, so it is not part of the public
  # contract; it is covered by tests/test_route_policy.py and
  # tests/test_mentors.py instead.
  /api/mentors/{mentor_id}/reviews:
    get:
      tags: [mentors]
      summary: Public review list + average for one mentor
      x-flask-path: /api/mentors/<int:mentor_id>/reviews
      x-auth: public
      x-response-keys: [average, count, reviews, success]
      parameters:
        - {name: mentor_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Review list (average null, count 0 when no reviews)
          content:
            application/json:
              schema:
                type: object
                required: [average, count, reviews, success]
                properties:
                  average: {type: number, nullable: true}
                  count: {type: integer}
                  reviews: {type: array, items: {type: object}}
                  success: {type: boolean}
        '404':
          description: Unknown mentor id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/opportunities/refresh-status:
    get:
      tags: [career]
      summary: Opportunity board refresh status
      x-flask-path: /api/opportunities/refresh-status
      x-auth: public
      x-response-keys: [closed, last_refresh, last_updated, open, success, total]
      responses:
        '200':
          description: Refresh status counts
          content:
            application/json:
              schema:
                type: object
                required: [success, total, open, closed]
                properties:
                  success: {type: boolean}
                  total: {type: integer}
                  open: {type: integer}
                  closed: {type: integer}
  /api/retrospectives/learnings:
    get:
      tags: [career]
      summary: Public retrospective learnings
      x-flask-path: /api/retrospectives/learnings
      x-auth: public
      x-response-keys: [learnings, success]
      responses:
        '200':
          description: Learnings list
          content:
            application/json:
              schema:
                type: object
                required: [learnings, success]
                properties:
                  learnings: {type: array, items: {type: object}}
                  success: {type: boolean}
  /api/salary/curve:
    get:
      tags: [salary]
      summary: Salary growth curve for one role x tier
      x-flask-path: /api/salary/curve
      x-auth: public
      x-response-keys: [curve, disclaimer, role, success, tier]
      parameters:
        - {name: role, in: query, required: true, schema: {type: string}}
        - {name: tier, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Growth curve across experience bands
          content:
            application/json:
              schema:
                type: object
                required: [curve, role, success, tier]
                properties:
                  curve: {type: array, items: {type: object}}
                  role: {type: string}
                  tier: {type: string}
                  success: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/salary/scripts:
    get:
      tags: [salary]
      summary: Salary negotiation scripts (indicative, never live)
      x-flask-path: /api/salary/scripts
      x-auth: public
      x-response-keys: [disclaimer, scripts, success]
      responses:
        '200':
          description: Negotiation scripts
          content:
            application/json:
              schema:
                type: object
                required: [disclaimer, scripts, success]
                properties:
                  disclaimer: {type: string}
                  scripts: {type: array, items: {type: object}}
                  success: {type: boolean}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Error:
      description: >
        Standard error envelope. Matches studybuddy/exceptions.py —
        every API error returns {"error": "<user-safe message>"} with the
        exception's status_code.
      type: object
      required: [error]
      properties:
        error: {type: string}
      example: {error: "Please log in to continue."}
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Login required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Feature disabled / not allowed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadGateway:
      description: Upstream service failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Request body too large
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
