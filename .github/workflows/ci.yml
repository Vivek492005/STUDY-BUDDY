# TEST-01: Continuous Integration — runs on every push and PR.
# Jobs: lint (Ruff) | test (pytest, SQLite + Postgres 16) | security (Bandit, pip-audit)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OPP_NO_AUTO_REFRESH: "1"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check . --no-cache
      # #6: every full-page template must declare <html lang="...">
      - run: python scripts/check_lang.py
      # #10: strict dataset validation, advisory for now (legacy
      # provenance warnings) — warning count uploaded as an artifact
      - name: Validate datasets (strict, advisory)
        continue-on-error: true
        run: python scripts/validate_data.py --strict --report validate-data-report.json
      - name: Upload data-validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-data-report
          path: validate-data-report.json
          if-no-files-found: ignore
      # NOTE: ruff format is intentionally not gated yet — 187 legacy files
      # would be reformatted. ARC-07 ratchets formatting per-module.
      # ARC-07: mypy on new typed modules (gradual adoption)
      - run: set -o pipefail; mypy studybuddy/auth_hardening.py studybuddy/pii_redaction.py studybuddy/exceptions.py studybuddy/anti_gaming.py studybuddy/grounded_gen.py --ignore-missing-imports 2>&1 | tail -20

  test-sqlite:
    name: pytest (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      # TEST-11: -n auto (xdist) + DeprecationWarning as error for our code.
      - run: set -o pipefail; python -m pytest tests/ -q -n auto -p no:cacheprovider --tb=line -W error::DeprecationWarning -W "ignore::DeprecationWarning:flask_login.login_manager" --cov=studybuddy --cov-report=term-missing 2>&1 | tail -60
        env:
          STUDYBUDDY_NO_PARSE_SANDBOX: "1"
      # TEST-04: Benchmarks on every PR (small subset)
      - run: set -o pipefail; python benchmarks/run.py --quick 2>&1 | tail -10
        env:
          STUDYBUDDY_NO_PARSE_SANDBOX: "1"

  test-postgres:
    name: pytest (Postgres 16)
    runs-on: ubuntu-latest
    # TEST-03: fixed 2026-10-19 — the migration chain was missing tables for
    # models added after the baseline (llm_consent, password_reset_token,
    # user_api_key, user.email_verified*). Migration 01c271a81d47 covers them;
    # `flask db upgrade head` + `flask db check` are green on Postgres 16.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sb
          POSTGRES_PASSWORD: sb
          POSTGRES_DB: sb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sb:sb@localhost:5432/sb_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install pytest pytest-xdist
      # ARC-03: migrate first (prod boots skip create_all on Postgres),
      # then drift-check, then the suite.
      - run: flask db upgrade head
        env:
          FLASK_APP: unified_app
      - run: flask db check
        env:
          FLASK_APP: unified_app
      - run: set -o pipefail; python -m pytest tests/ -q -n auto -p no:cacheprovider --tb=line 2>&1 | tail -50
        env:
          STUDYBUDDY_NO_PARSE_SANDBOX: "1"

  security:
    name: Bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      # SEC-15: fail on Medium+ only. Low-severity hits are triaged
      # separately (ARC-09): B311 random-for-shuffling, B105 pass_pct,
      # B110/B112 swallowed-error patterns are not CI blockers.
      - run: bandit -q -r unified_app.py studybuddy/ -x tests -ll
      - run: pip-audit --desc

  secrets-scan:
    # SEC-13: fail the build if any secret (API key, token, private key)
    # is committed. Full history is scanned so a secret can never hide
    # in an old commit either.
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
