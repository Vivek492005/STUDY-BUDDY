# Render deployment for the AI Career & Research Assistant (Flask + gunicorn).
# Replaces dashboard-only manual config (P2#19).
services:
  - type: web
    name: study-buddy
    runtime: python
    # OPS-01: pin the interpreter — a 3.10 vs 3.12 mismatch once crashed
    # every deploy (backslash in f-string is a SyntaxError on <3.12).
    # SEC-03 (audit 2026-10-28): this service block MUST declare envVars
    # exactly once. A previous version declared it twice; in YAML the
    # last block wins, which silently dropped the PYTHON_VERSION pin.
    # tests/test_render_yaml.py fails on duplicate keys.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard (from Google AI Studio)
      - key: GOOGLE_CLIENT_ID
        sync: false # set in the Render dashboard (Google Cloud Console OAuth client)
      - key: GOOGLE_CLIENT_SECRET
        sync: false # set in the Render dashboard (Google Cloud Console OAuth client)
      - key: GITHUB_TOKEN
        sync: false # optional: raises GitHub API rate limits for the paper constructor
      - key: DATABASE_URL
        fromDatabase:
          name: acra-db
          property: connectionString
    buildCommand: python scripts/write_version.py && pip install --require-hashes -r requirements.txt
    # Worker/timeout settings live ONLY in gunicorn.conf.py (audit fix,
    # 2026-10-28 — previously this line said 2 workers / 120s while the
    # conf file said 1 worker / 60s, and the live server ran the
    # unmeasured 2-worker shape on a 512 MB instance). The conf file
    # binds 0.0.0.0:$PORT itself; do not re-add inline worker flags
    # here. tests/test_render_yaml.py locks this command.
    startCommand: gunicorn -c gunicorn.conf.py unified_app:app
    healthCheckPath: /healthz

# DATABASE DECISION — READ BEFORE CHANGING THIS BLOCK (audit SEC-02,
# 2026-10-28): docs/ops/hosting-plan.md records a decision to use Neon
# free Postgres because Render free Postgres expires 30 days after
# creation (14-day grace, then deletion), but this file still wires
# DATABASE_URL from the Render free database acra-db below. Do NOT edit
# this block from the config alone: confirm which database production
# actually uses in the Render dashboard, then follow the migration /
# cutover steps in docs/ops/neon-database-decision.md. Changing this
# block without a verified cutover either breaks production deploys
# (pointing at a Neon database that does not exist yet) or silently
# re-points a Neon-backed production at Render free Postgres.
databases:
  - name: acra-db
    plan: free
