<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="hub">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script nonce="{{ csp_nonce() }}">document.documentElement.classList.replace('no-js', 'js');</script>
    <title>{{ code }} — AI Career &amp; Research Assistant</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bento.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kinetic.css') }}">
    <style>
    /* a11y: skip link (same rules as base.html) */
    .skip-link{position:absolute;left:-9999px;top:0;background:#fff;color:#000;padding:.75rem 1.25rem;z-index:9999;font-weight:700;border-radius:0 0 8px 0}
    .skip-link:focus{left:0}
    </style>
</head>
<body class="sb-app">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="b-ambient" aria-hidden="true">
        <div class="b-blob b-b1"></div>
        <div class="b-blob b-b2"></div>
        <div class="b-blob b-b3"></div>
        <div class="b-gridlines"></div>
    </div>
    <main class="b-wrap" style="display:flex;align-items:center;justify-content:center;min-height:100vh;" id="main-content" tabindex="-1">
        <div class="b-card b-card--form b-reveal in" style="text-align:center;">
            <div style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:5rem;font-weight:700;line-height:1;"><span style="color:#2447ff">{{ code }}</span></div>
            <h1 style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.5rem;margin:1rem 0 .5rem;">
                {% if code == 404 %}Page not found
                {% elif code == 405 %}Action not allowed
                {% elif code == 429 %}Slow down a little
                {% else %}Something went wrong{% endif %}
            </h1>
            <p style="color:var(--b-muted);margin-bottom:2rem;line-height:1.6;">{{ message }}</p>
            <a class="b-btn b-btn--primary b-magnet" href="{{ url_for('index') }}">Back to the Hub</a>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/bento.js') }}" defer></script>
    {% include "_csp_beacon.html" %}
    <script src="{{ url_for('static', filename='js/cursor.js') }}" defer></script>
</body>
</html>
